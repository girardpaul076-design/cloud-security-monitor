- name: Package and Deploy Security IaC Stack
      env:
        IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
      run: |
        SALT_VALUE="${IP_HASH_SALT:-fallback-dev-salt-12345}"
        echo "Packaging and deploying stack..."
        
        # Package local code and update template S3 URIs
        aws cloudformation package \
          --template-file template.yaml \
          --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-kkjugswbaupu \
          --output-template-file packaged-template.yaml \
          --region us-east-2

        # Deploy the S3-referenced package directly
        aws cloudformation deploy \
          --template-file packaged-template.yaml \
          --stack-name cloud-security-monitor-stack-v2 \
          --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
          --parameter-overrides IpHashSalt="$SALT_VALUE" \
          --region us-east-2
