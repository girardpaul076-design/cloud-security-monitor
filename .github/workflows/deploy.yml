- name: Deploy Native CloudFormation Stack with Python Code
        env:
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          SALT_VALUE="${IP_HASH_SALT:-fallback-dev-salt-12345}"
          
          # Create deployment package
          mkdir -p package
          cp lambda_function.py package/
          cd package && zip -r ../function.zip . && cd ..
          
          # Deploy template
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name cloud-security-monitor-stack-v2 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides IpHashSalt="$SALT_VALUE" \
            --region us-east-2
            
          # Update Lambda code directly with the packaged script
          aws lambda update-function-code \
            --function-name SecurityMonitorFunction \
            --zip-file fileb://function.zip \
            --region us-east-2 || true
