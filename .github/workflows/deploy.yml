name: Deploy CloudFormation Stack

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template --template-body file://template.yaml

      - name: Deploy Native CloudFormation Stack with Python Code
        env:
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          SALT_VALUE="${IP_HASH_SALT:-fallback-dev-salt-12345}"
          
          # Create deployment package from the src folder
          mkdir -p package
          cp src/lambda_function.py package/
          cd package && zip -r ../function.zip . && cd ..
          
          # Create changeset explicitly with correct --parameters flag
          aws cloudformation create-change-set \
            --stack-name cloud-security-monitor-stack-v2 \
            --template-body file://template.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameters ParameterKey=IpHashSalt,ParameterValue="$SALT_VALUE" \
            --change-set-name deployment-changeset \
            --region us-east-2
            
          echo "Waiting for change set to build..."
          aws cloudformation wait change-set-create-complete \
            --stack-name cloud-security-monitor-stack-v2 \
            --change-set-name deployment-changeset \
            --region us-east-2
            
          # Execute the change set
          aws cloudformation execute-change-set \
            --stack-name cloud-security-monitor-stack-v2 \
            --change-set-name deployment-changeset \
            --region us-east-2
            
          # Update Lambda code directly with the packaged script
          aws lambda update-function-code \
            --function-name SecurityMonitorFunction \
            --zip-file fileb://function.zip \
            --region us-east-2 || true
