- name: Deploy Native CloudFormation Stack with Python Code
        env:
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          SALT_VALUE="${IP_HASH_SALT:-fallback-dev-salt-12345}"
          
          # Create deployment package from the src folder
          mkdir -p package
          cp src/lambda_function.py package/
          cd package && zip -r ../function.zip . && cd ..
          
          # 1. Create a named change set
          aws cloudformation create-change-set \
            --stack-name cloud-security-monitor-stack-v2 \
            --template-file template.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameters ParameterKey=IpHashSalt,ParameterValue="$SALT_VALUE" \
            --change-set-name diagnostic-set \
            --region us-east-2
            
          # 2. Wait for it to fail and describe the exact error reason
          echo "Waiting for change set evaluation..."
          aws cloudformation wait change-set-create-complete \
            --stack-name cloud-security-monitor-stack-v2 \
            --change-set-name diagnostic-set \
            --region us-east-2 || true
            
          # 3. Print the exact validation error description
          aws cloudformation describe-change-set \
            --stack-name cloud-security-monitor-stack-v2 \
            --change-set-name diagnostic-set \
            --region us-east-2
