AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Unified Cloud Resume and SIEM Compliance Security Monitor Backend

Parameters:
  IpHashSalt:
    Type: String
    NoEcho: true
    Default: "default-change-in-github-secrets"
    Description: Secret salt used to hash visitor IP addresses for privacy-safe SIEM correlation

Globals:
  HttpApi:
    CorsConfiguration:
      AllowMethods: [GET, OPTIONS]
      AllowHeaders: [Content-Type]
      AllowOrigins: ['*']

Resources:
  # 1. Visitor Counter & 24h Deduplication Datastore (with Auto-Cleanup TTL)
  ResumeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloud-resume-stats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 2. SIEM Security Incidents & Simulated Attacks Datastore
  SiemMetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SiemMetricsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # 3. Test S3 Bucket Used for Intrusion Simulations
  SimulationVictimBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "siem-simulation-victim-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  # 4. Dual-Purpose Logic Handler (Unique Visitor Tracking & SIEM Threat Remediation)
  ResumeCounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: resume-visitor-counter-iac
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Environment:
        Variables:
          IP_HASH_SALT: !Ref IpHashSalt
      Policies:
        - DynamoDBCrudPolicy:
            TableName: cloud-resume-stats
        - DynamoDBCrudPolicy:
            TableName: SiemMetricsTable
        - S3CrudPolicy:
            BucketName: !Sub "siem-simulation-victim-${AWS::AccountId}-${AWS::Region}"
      Events:
        CounterApiEvent:
          Type: HttpApi
          Properties:
            Path: /resume-visitor-counter
            Method: get
        MetricsApiEvent:
          Type: HttpApi
          Properties:
            Path: /metrics
            Method: get
        S3PublicBreachRule:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source: ["aws.s3"]
              detail-type: ["AWS API Call via CloudTrail"]
              detail:
                eventSource: ["://amazonaws.com"]
                eventName: ["PutBucketAcl", "PutBucketPolicy"]

Outputs:
  DashboardApiUrl:
    Description: "Base URL to paste into your frontend/index.html script"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TargetVictimBucket:
    Description: "Bucket Name to paste into simulate_attack.py"
    Value: !Sub "siem-simulation-victim-${AWS::AccountId}-${AWS::Region}"
