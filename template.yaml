AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Automated S3 Security Remediation Monitor Stack with Built-in CloudTrail Logging

Resources:
  # 1. Dedicated S3 Bucket to hold CloudTrail audit logs
  CloudTrailLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "siem-audit-logs-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # 2. Strict Bucket Policy allowing CloudTrail to write logs securely
  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: ://amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub "arn:aws:s3:::${CloudTrailLogBucket}"
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: ://amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${CloudTrailLogBucket}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
  # ==========================================
  # 3. COMPLIANCE ENGINE SUBSYSTEM (GUARDRAILS)
  # ==========================================
  
  # The Remediation Function
  S3RemediationLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s3-public-bucket-remediator
      Handler: index.lambda_handler
      Runtime: python3.12
      InlineCode: |
        import boto3
        import json

        s3 = boto3.client('s3')

        def lambda_handler(event, context):
            # Parse bucket name from the incoming EventBridge/CloudTrail schema
            try:
                bucket_name = event['detail']['requestParameters']['bucketName']
                print(f"🚨 Compliance violation detected! Bucket exposed: {bucket_name}")
                
                # Remediation Action: Enforce 100% Private Block Public Access
                s3.put_public_access_block(
                    Bucket=bucket_name,
                    PublicAccessBlockConfiguration={
                        'BlockPublicAcls': True,
                        'IgnorePublicAcls': True,
                        'BlockPublicPolicy': True,
                        'RestrictPublicBuckets': True
                    }
                )
                print(f"✅ Successfully remediated {bucket_name}. Public access blocked.")
                
            except Exception as e:
                print(f"Error executing remediation loop: {str(e)}")
      Policies:
        # Give Lambda permissions to change S3 public access settings back to private
        - Statement:
            - Effect: Allow
              Action:
                - "s3:PutBucketPublicAccessBlock"
                - "s3:GetBucketPublicAccessBlock"
              Resource: "arn:aws:s3:::*"
              
  # The Detection Layer: EventBridge Rule matching CloudTrail API Calls
  S3PublicEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: "Detects PutBucketAcl, PutBucketPolicy, and PutBucketPublicAccessBlock events"
      State: ENABLED
      EventPattern:
        source:
          - "aws.s3"
        detail-type:
          - "AWS API Call via CloudTrail"
        detail:
          eventName:
            - "PutBucketAcl"
            - "PutBucketPolicy"
            - "PutBucketPublicAccessBlock"
      Targets:
        - Arn: !GetAtt S3RemediationLambda.Arn
          Id: "S3RemediationTarget"

  # Permission for EventBridge to wake up our Remediation Lambda
  PermissionForEventsToInvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3RemediationLambda
      Action: "lambda:InvokeFunction"
      Principal: "://amazonaws.com"
      SourceArn: !GetAtt S3PublicEventRule.Arn

  # 3. Global CloudTrail Engine to record API events
  SecurityCloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: project-siem-security-trail
      S3BucketName: !Ref CloudTrailLogBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true

  # 4. Security Alert Topic
  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloud-security-alerts

  # 5. Automated Remediation Lambda Function
  SecurityRemediationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s3-security-remediator
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      CodeUri: src/
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref SecurityAlertTopic
      Policies:
        - Statement:
            - Sid: S3RemediationPolicy
              Effect: Allow
              Action:
                - s3:PutPublicAccessBlock
              Resource: "*"
            - Sid: SNSPublishPolicy
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref SecurityAlertTopic
      Events:
        GetMetricsApi:
          Type: HttpApi
          Properties:
            Path: /metrics
            Method: GET
            
  # 6. Detection Rule Engine (EventBridge)
  S3SecurityEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: DetectPublicS3Changes
      Description: Monitors CloudTrail events for public S3 modifications
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - PutBucketAcl
            - PutBucketPolicy
            - PutPublicAccessBlock
      State: ENABLED
      Targets:
        - Arn: !GetAtt SecurityRemediationFunction.Arn
          Id: "TargetLambda"

  # 7. Permission for EventBridge to invoke our security Lambda
  PermissionForEventsToInvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SecurityRemediationFunction
      Action: lambda:InvokeFunction
      Principal: ://amazonaws.com
      SourceArn: !GetAtt S3SecurityEventRule.Arn

  # 8. Database to track our portfolio SIEM counter metrics
  SiemMetricsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: SiemMetricsTable
      PrimaryKey:
        Name: metric_id
        Type: String
