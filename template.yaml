AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Resume & SIEM Security Monitor Stack

Parameters:
  IpHashSalt:
    Type: String
    Default: 'fallback-dev-salt'
    Description: Secret salt used for privacy-safe visitor IP hashing.
    NoEcho: true

Resources:
  VisitorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloud-resume-stats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SiemMetricsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  SecurityMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          IP_HASH_SALT: !Ref IpHashSalt
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitorTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MetricsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutBucketAcl
                - s3:PutBucketPolicy
                - s3:PutBucketPublicAccessBlock
                - s3:ListBucket
              Resource: '*'

  ServerlessHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  ApiRouteMapping:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ServerlessHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SecurityMonitorFunction.Arn}/invocations"
      PayloadFormatVersion: '2.0'

  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SecurityMonitorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ServerlessHttpApi}/*/*"

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ServerlessHttpApi
      RouteKey: 'ANY /{proxy+}'
      Target: !Sub "integrations/${ApiRouteMapping}"

Outputs:
  ApiURL:
    Description: "API Gateway HTTP API Endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
