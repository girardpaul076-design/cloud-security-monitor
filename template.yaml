AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Resume & SIEM Compliance Monitor Stack

Parameters:
  IpHashSalt:
    Type: String
    Default: 'fallback-dev-salt'
    Description: Secret salt used for privacy-safe visitor IP hashing.
    NoEcho: true

Resources:
  VisitorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloud-resume-stats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SiemMetricsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  SecurityMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          IP_HASH_SALT: !Ref IpHashSalt
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitorTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MetricsTable
        - S3AdminAccessPolicy:
            BucketName: '*'
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        S3PublicExposureEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - AWS API Call via CloudTrail
              detail:
                eventName:
                  - PutBucketAcl
                  - PutBucketPolicy
                  - PutBucketPublicAccessBlock

Outputs:
  ApiURL:
    Description: "API Gateway HTTP API Endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
