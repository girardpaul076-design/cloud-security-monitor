AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Unified Cloud Resume and SIEM Compliance Security Monitor Backend

Globals:
  HttpApi:
    CorsConfiguration:
      AllowMethods: [GET, OPTIONS]
      AllowHeaders: [Content-Type]
      AllowOrigins: ['*']

Resources:
  # 1. High-Performance SIEM Datastore
  ResumeTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: cloud-resume-stats
      PrimaryKey:
        Name: id
        Type: String

  # 2. Test S3 Bucket Used for Intrusion Simulations
  SimulationVictimBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "siem-simulation-victim-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  # 3. Dual-Purpose Logic Handler (Visitor Tracking & Threat Remediation)
  ResumeCounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: resume-visitor-counter-iac
      Handler: index.lambda_handler
      Runtime: python3.12
      InlineCode: |
        import json
        import boto3
        import time
        from datetime import datetime

        s3 = boto3.client('s3')
        dynamodb = boto3.resource('dynamodb')
        table = dynamodb.Table('cloud-resume-stats')

        def lambda_handler(event, context):
            # Check if execution invocation initiated from an EventBridge Guard Duty/CloudTrail Rule
            if "detail" in event:
                detail = event["detail"]
                bucket_name = detail.get("requestParameters", {}).get("bucketName")
                
                if bucket_name:
                    # 1. Automate remediation back to 100% private
                    try:
                        s3.put_bucket_acl(Bucket=bucket_name, ACL='private')
                        status_msg = "REMEDIATED"
                    except Exception as e:
                        status_msg = f"ERROR: {str(e)}"
                    
                    # 2. Append incident log record to the dashboard datastore
                    incident_id = f"ALERT-{int(time.time())}"
                    table.put_item(
                        Item={
                            'id': incident_id,
                            'timestamp': datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC'),
                            'bucket_name': bucket_name,
                            'event_type': 'PutBucketAcl (Public Exposure Event)',
                            'status': status_msg
                        }
                    )
                    return {"status": "complete", "incident_id": incident_id}

            # Handle standard web dashboard fetch routes
            path = event.get('requestContext', {}).get('http', {}).get('path', '')
            if 'resume-visitor-counter' in path:
                response = table.update_item(
                    Key={'id': 'visitors'},
                    UpdateExpression='ADD #c :val',
                    ExpressionAttributeNames={'#c': 'count'},
                    ExpressionAttributeValues={':val': 1},
                    ReturnValues='UPDATED_NEW'
                )
                return {
                    'statusCode': 200,
                    'headers': {'Content-Type': 'application/json'},
                    'body': json.dumps({'count': int(response['Attributes']['count'])})
                }
            elif 'security-alerts' in path:
                response = table.scan()
                items = [i for i in response.get('Items', []) if i.get('id') != 'visitors']
                return {
                    'statusCode': 200,
                    'headers': {'Content-Type': 'application/json'},
                    'body': json.dumps({'alerts': items})
                }
            return {'statusCode': 404, 'body': 'Not Found'}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: cloud-resume-stats
        - S3CrudPolicy:
            BucketName: !Sub "siem-simulation-victim-${AWS::AccountId}-${AWS::Region}"
      Events:
        CounterApiEvent:
          Type: HttpApi
          Properties:
            Path: /resume-visitor-counter
            Method: get
        SecurityAlertsEvent:
          Type: HttpApi
          Properties:
            Path: /security-alerts
            Method: get
        # Automated Rule Trigger: Intercepts S3 configuration vulnerability exploits
        S3PublicBreachRule:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source: ["aws.s3"]
              detail-type: ["AWS API Call via CloudTrail"]
              detail:
                eventSource: ["://amazonaws.com"]
                eventName: ["PutBucketAcl", "PutBucketPolicy"]

Outputs:
  DashboardApiUrl:
    Description: "Base URL to paste into your index.html script"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TargetVictimBucket:
    Description: "Bucket Name to paste into simulate_attack.py"
    Value: !Sub "siem-simulation-victim-${AWS::AccountId}-${AWS::Region}"


```
