AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Streamlined Cloud Security Monitor Stack

Parameters:
  IpHashSalt:
    Type: String
    Default: 'fallback-dev-salt-12345'
    Description: Secret salt for hashing visitor IPs.
    NoEcho: true

Resources:
  VisitorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecurityMonitorPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt VisitorTable.Arn
                  - !GetAtt MetricsTable.Arn

  SecurityMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          IP_HASH_SALT: !Ref IpHashSalt
          VISITOR_TABLE: !Ref VisitorTable
          METRICS_TABLE: !Ref MetricsTable
          VISITOR_COUNTER_ID: resume-visitor-count
      Events:
        RootAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ProxyAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
    DependsOn:
      - LambdaExecutionRole
      - VisitorTable
      - MetricsTable

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cloud-security-monitor-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

Outputs:
  ApiURL:
    Description: "API Gateway HTTP API Endpoint URL"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  VisitorTableName:
    Description: "DynamoDB table storing visitor count"
    Value: !Ref VisitorTable
  MetricsTableName:
    Description: "DynamoDB table storing security events"
    Value: !Ref MetricsTable